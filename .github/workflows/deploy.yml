# https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions
name: Cloudflare deploy api+browser

# Push to main deploys production (issue #308). Staging is on demand.
on:
  push:
    branches:
      - "main"
  workflow_dispatch:
    inputs:
      env:
        description: "Environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production

jobs:
  cloudflare-deploy:
    name: Cloudflare deploy (${{ inputs.env || 'production' }})
    # Can switch to ubuntu-latest but self-hosted is safer and faster
    runs-on: [self-hosted]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4
        with:
          fetch-depth: "0"

      # CLOUDFLARE_API_TOKEN is all wrangler needs while the token reaches exactly
      # one account; add CLOUDFLARE_ACCOUNT_ID too if that stops being true.
      - name: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: just cloudflare deploy ${{ inputs.env || 'production' }}
