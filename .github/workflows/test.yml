# .yaml files in this directory are executed workflows:
# https://docs.github.com/en/free-pro-team@latest/actions/reference/workflow-syntax-for-github-actions
# This workflow is triggered on pushes to non-main (or master) branches
# Builds and tests the app (just test)
name: Test (self-hosted)

# https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions
on:
  push:
    # only non-main (and non-master) branches
    branches:
      - "**"
      - "!main"
      - "!master"

jobs:
  test_remote_mode:
    name: remote mode
    runs-on: [self-hosted]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: "0"

      - name: Check docker daemon responds
        # A stuck daemon otherwise hangs `just test` until the 20 minute step timeout
        shell: bash
        timeout-minutes: 1
        run: |
          out=$(mktemp)
          docker info >"$out" 2>&1 &
          pid=$!
          for _ in $(seq 1 15); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" 2>/dev/null
            echo "::error::docker daemon did not answer 'docker info' within 15s (daemon stuck?) on runner ${RUNNER_NAME}"
            exit 1
          fi
          if ! wait "$pid"; then
            cat "$out"
            echo "::error::'docker info' failed on runner ${RUNNER_NAME}: docker daemon not reachable"
            exit 1
          fi
          grep -E "Server Version|Operating System" "$out" || true

      - name: test
        run: just test remote
        timeout-minutes: 20

  test_local_mode:
    name: local mode
    runs-on: [self-hosted]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5
        with:
          fetch-depth: "0"

      - name: Check docker daemon responds
        # A stuck daemon otherwise hangs `just test` until the 20 minute step timeout
        shell: bash
        timeout-minutes: 1
        run: |
          out=$(mktemp)
          docker info >"$out" 2>&1 &
          pid=$!
          for _ in $(seq 1 15); do
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          if kill -0 "$pid" 2>/dev/null; then
            kill -9 "$pid" 2>/dev/null
            echo "::error::docker daemon did not answer 'docker info' within 15s (daemon stuck?) on runner ${RUNNER_NAME}"
            exit 1
          fi
          if ! wait "$pid"; then
            cat "$out"
            echo "::error::'docker info' failed on runner ${RUNNER_NAME}: docker daemon not reachable"
            exit 1
          fi
          grep -E "Server Version|Operating System" "$out" || true

      - name: test
        run: just test local
        timeout-minutes: 20

  test_cloudflare_mode:
    name: cloudflare mode
    runs-on: [self-hosted]
    steps:
      - name: Check out the repo
        uses: actions/checkout@v2
        with:
          fetch-depth: "0"

      - name: test
        run: just test cloudflare
        timeout-minutes: 20
