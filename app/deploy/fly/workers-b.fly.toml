# DEPRECATED: see README.md. The image tag is kept in step with app/worker/mod.json by
# `just sync-worker-version`, but this app is only deployed by hand.
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = 'metapage-io-workers-b'
primary_region = 'ord'

[build]
  image = 'metapage/metaframe-docker-worker:0.54.87-standalone'

[[vm]]
  memory = '4gb'
  cpu_kind = 'shared'
  cpus = 2

[env]
  METAPAGE_IO_WORKER_CPUS = '2'
  METAPAGE_IO_WORKER_RUN_STANDALONE = true
  # METAPAGE_IO_WORKER_QUEUE is set as a secret

[[restart]]
  policy = "on-failure"
  retries = 10

[experimental]
cmd = "run"
