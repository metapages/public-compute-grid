# The api on the Cloudflare Workers runtime (issue #308): `wrangler dev` runs
# the bundled Worker in workerd, with local D1 and Durable Objects, behind the
# same traefik host as the remote stack. MinIO stands in for R2 (both speak the
# S3 API). There is no redis and no denokv: each queue lives in one Durable
# Object, and the store is D1.
#
# The Worker is bundled on the host before `up` (`just cloudflare build-api`):
# deno resolves the workspace import maps, wrangler only serves the result and
# reloads when dist/ or .assets/ change.
services:
  api:
    depends_on:
      traefik:
        condition: service_started
      minio:
        condition: service_healthy
    image: node:22-bookworm-slim
    working_dir: /app/app/cloudflare
    command: >-
      npx --yes wrangler@4.151.3 dev
      --ip 0.0.0.0 --port 8787
      --persist-to /wrangler-state
      --show-interactive-dev-session=false
      --var AWS_ACCESS_KEY_ID:minioaccesskey123123
      --var AWS_SECRET_ACCESS_KEY:minioaccesskey123123
      --var AWS_ENDPOINT:http://minio:9000
      --var AWS_REGION:us-west-2
      --var AWS_S3_BUCKET:localbucket
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8787/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 60
    expose:
      - "8787"
    environment:
      - CI=true
      - WRANGLER_SEND_METRICS=false
      - NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY:-}
    volumes:
      - ./app/cloudflare:/app/app/cloudflare
      - npm_cache:/root/.npm
      - wrangler_state:/wrangler-state
    networks:
      - default
    extra_hosts:
      - host.docker.internal:host-gateway
    labels:
      - "traefik.enable=true"
      - "custom.label=worker-metaframe.localhost"
      - "traefik.http.routers.api.rule=Host(`worker-metaframe.localhost`)"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.services.api.loadbalancer.server.port=8787"
    logging:
      driver: ${LOGGING_API:-json-file}

  worker:
    depends_on:
      api:
        condition: service_healthy
    entrypoint: [
      "deno",
      "run",
      "--minimum-dependency-age=0",
      "--unsafely-ignore-certificate-errors",
      "--watch",
      "--allow-all",
      "--unstable-kv",
      "--unstable-broadcast-channel",
      "--unstable-cron",
      "src/cli.ts",
    ]
    command: run --id=test-worker1 --cpus=2 --gpus=0 --api-address=http://api:8787 --data-directory ${WORKER_DATA_DIRECTORY:-/tmp/worker-metapage-io-dev1} local1
    build:
      context: .
      dockerfile: app/worker/Dockerfile
      target: worker
    environment:
      - DEV_ONLY_EXTERNAL_SERVER_ADDRESS=https://worker-metaframe.localhost:${APP_PORT:-443}
      - CONTAINER_MTFM_IO_DISABLE_KILLING_UNKNOWN_JOBS=true
      - APP_PORT=${APP_PORT:-443}
      - IGNORE_CERTIFICATE_ERRORS=true
      - NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY:-}
      - DENO_DIR=/deno
      - DENO_INSTALL_ROOT=/deno
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-localbucket}
    volumes:
      - ./deno.json:/app/deno.json
      - ./deno.lock:/app/deno.lock:ro
      - ./app/shared:/app/app/shared
      - ./app/mcp:/app/app/mcp
      - ./app/worker:/app/app/worker
      - ./app/browser/dist:/app/app/browser/dist
      - ./app/api:/app/app/api
      - /tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
      - deno:/deno
      - node_modules:/app/node_modules
    extra_hosts:
      - host.docker.internal:host-gateway
      - minio.worker-metaframe.localhost:host-gateway
      - worker-metaframe.localhost:host-gateway
    networks:
      - default
    logging:
      driver: ${LOGGING_WORKER:-json-file}

  worker2:
    depends_on:
      api:
        condition: service_healthy
    entrypoint: [
      "deno",
      "run",
      "--minimum-dependency-age=0",
      "--unsafely-ignore-certificate-errors",
      "--watch",
      "--allow-all",
      "--unstable-kv",
      "--unstable-broadcast-channel",
      "--unstable-cron",
      "src/cli.ts",
    ]
    command: run --id=test-worker2 --cpus=2 --gpus=0 --api-address=http://api:8787 --data-directory ${WORKER_DATA_DIRECTORY:-/tmp/worker-metapage-io-dev2}-2 local1
    build:
      context: .
      dockerfile: app/worker/Dockerfile
      target: worker
    environment:
      - DEV_ONLY_EXTERNAL_SERVER_ADDRESS=https://worker-metaframe.localhost:${APP_PORT:-443}
      - CONTAINER_MTFM_IO_DISABLE_KILLING_UNKNOWN_JOBS=true
      - APP_PORT=${APP_PORT:-443}
      - IGNORE_CERTIFICATE_ERRORS=true
      - NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY:-}
      - DENO_DIR=/deno
      - DENO_INSTALL_ROOT=/deno
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-localbucket}
    volumes:
      - ./deno.json:/app/deno.json
      - ./deno.lock:/app/deno.lock:ro
      - ./app/shared:/app/app/shared
      - ./app/mcp:/app/app/mcp
      - ./app/worker:/app/app/worker
      - ./app/browser/dist:/app/app/browser/dist
      - ./app/api:/app/app/api
      - /tmp:/tmp
      - /var/run/docker.sock:/var/run/docker.sock
      - deno:/deno
      - node_modules:/app/node_modules
    extra_hosts:
      - host.docker.internal:host-gateway
      - minio.worker-metaframe.localhost:host-gateway
      - worker-metaframe.localhost:host-gateway
    networks:
      - default
    logging:
      driver: ${LOGGING_WORKER:-json-file}

  create-s3-bucket:
    depends_on:
      minio:
        condition: service_healthy
    image: denoland/deno:alpine-2.9.3
    command: deno run --minimum-dependency-age=0 --allow-all ./src/s3/create-bucket-development.ts
    working_dir: /app/app/api
    environment:
      - NPM_CONFIG_REGISTRY=${NPM_CONFIG_REGISTRY:-}
      - AWS_ACCESS_KEY_ID=minioaccesskey123123
      - AWS_SECRET_ACCESS_KEY=minioaccesskey123123
      - AWS_ENDPOINT=http://minio:9000
      - AWS_S3_BUCKET=${AWS_S3_BUCKET:-localbucket}
      - DENO_DIR=/deno
      - DENO_INSTALL_ROOT=/deno
      - AWS_REGION=${AWS_REGION:-us-west-2}
    volumes:
      - ./app/api/deno.json:/app/app/api/deno.json
      - ./app/api/src:/app/app/api/src
      - ./deno.json:/app/deno.json
      - ./deno.lock:/app/deno.lock:ro
      - ./app/shared:/app/app/shared
      - ./app/mcp:/app/app/mcp
      - deno:/deno
    networks:
      - default

  minio:
    depends_on:
      traefik:
        condition: service_started
    image: minio/minio:RELEASE.2024-04-28T17-53-50Z
    command: server --address 0.0.0.0:9000 /data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      MINIO_SERVER_URL: https://minio.worker-metaframe.localhost:${APP_PORT:-443}
      MINIO_BROWSER_REDIRECT_URL: https://minio.worker-metaframe.localhost:${APP_PORT:-443}
      MINIO_REGION: ${AWS_REGION:-us-west-2}
      MINIO_ROOT_PASSWORD: minioaccesskey123123
      MINIO_ROOT_USER: minioaccesskey123123
    extra_hosts:
      - host.docker.internal:host-gateway
      - minio.worker-metaframe.localhost:host-gateway
    restart: always
    volumes:
      - ./app/.cache/minio:/data
    networks:
      - default
    labels:
      - "custom.label=worker-metaframe.localhost"
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.worker-metaframe.localhost`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.routers.minio.middlewares=cors-middleware@file"

  traefik:
    image: traefik:v3.6.14
    command:
      - --global.sendanonymoususage=false
      - --api.insecure=true
      - --api.dashboard=true
      - --providers.docker=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.watch=true
      - --providers.docker.constraints=Label(`custom.label`,`worker-metaframe.localhost`)
      - --providers.docker.exposedbydefault=false
      - --providers.file.filename=/etc/traefik/config.yml
      - --providers.file.watch=true
      - --log.level=INFO
      - --log.format=common
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:${APP_PORT:-443}
      - --entrypoints.websecure.http.tls=true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik=true"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "${APP_PORT:-443}:${APP_PORT:-443}"
    volumes:
      - ./app/.cache/traefik/certs:/etc/certs:ro
      - ./app/.traefik/config.yml:/etc/traefik/config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - default

volumes:
  npm_cache:
    driver: local
  wrangler_state:
    driver: local
